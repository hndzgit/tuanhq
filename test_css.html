<style>
.text-liquid-glass {
  background: linear-gradient(45deg, red, green);
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
}
</style>
</head>

  <h1 class="text-liquid-glass">
    <span>Hello</span>
  </h1>
</body>
